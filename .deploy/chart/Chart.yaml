apiVersion: v2
name: kube-nipper-console-plugin
description: |-
  Deploys the full OpenShift kube-nipper operator, which includes both the kube-nipper contoller
  and the console plugin.  It has the ability to create snapshots of either Pods that are
  deleted or have restarted containers, or of arbitrary Kubernetes resources with defined rules of
  when snapshots should be taken, all of which can be viewed in OpenShift console.
version: 0.1.0

dependencies:
- name: gnoma
  version: 0.1.0
  repository: oci://ghcr.io/ahplos
- name: kube-nipper-controller
  version: 0.1.0
  repository: oci://ghcr.io/ahplos/kube-nipper