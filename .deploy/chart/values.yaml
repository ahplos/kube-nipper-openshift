kube-nipper-controller:
  gnoma:
    gnomaDefs:
      VERSION: 0.1.0

gnoma:
  gnomaDefs:
    OPERATOR_NAME: kube-nipper
    PLUGIN_NAME: $<OPERATOR_NAME>-console-plugin
    NIP_PLUGIN_IMAGE: $<IMAGE_REGISTRY>/$<PLUGIN_NAME>:$<VERSION>
    NIPPER_CONSOLE_ADMIN: $<PLUGIN_NAME>

    NIP_IMAGE_PULL_SECRET: []

    IMAGE_REGISTRY: ghcr.io/ahplos

    CERT_NAME: $<HELM_RELEASE_NAME>-cert

    PORT: 8443

    NGINX_CONF_VOLUME: nginx-conf
    NGINX_CONF: nginx.conf

    CONSOLE_ADMIN: console-admin

  gnomaDefs-DEV:
    IMAGE_PULL_POLICY: Always
    IMAGE_REGISTRY: dev-demo-image-registry.apps-crc.testing
    NIP_IMAGE_PULL_SECRET:
    - name: demo-registry-credentials

  gnomaTemplates:
  - templateName: serviceAccount
    objName: $<PLUGIN_NAME>

  - templateName: clusterRole
    objName: $<CONSOLE_ADMIN>
    annotations:
      rbac.authorization.kubernetes.io/autoupdate: 'true'
    rules:
    - apiGroups:
      - operator.openshift.io
      resources:
      - consoles
      verbs: ["get", "list", "patch", "update", "watch"]

  - templateName: clusterRoleBinding
    objName: $<CONSOLE_ADMIN>
    subjects:
    - kind: ServiceAccount
      name: $<PLUGIN_NAME>
      namespace: $<HELM_RELEASE_NAMESPACE>
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: $<CONSOLE_ADMIN>

  - templateName: clusterRoleBinding
    objName: $<PLUGIN_NAME>
    subjects:
    - kind: ServiceAccount
      name: $<PLUGIN_NAME>
      namespace: $<HELM_RELEASE_NAMESPACE>
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: $<OPERATOR_NAME>-view

  - templateName: job
    objName: console-patcher
    image: appuio/oc:latest
    serviceAccountName: $<PLUGIN_NAME>
    command:
    - bash
    - -c
    - |-
      set -ex
      oc get consoles.operator.openshift.io cluster -o json | \
        jq '.spec.plugins |= (. + ["$<PLUGIN_NAME>"] | unique)' | \
        oc apply -f -

  - templateNames: [deployment, service]
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: $<CERT_NAME>
    objName: $<PLUGIN_NAME>
    replicas: 2
    port: $<PORT>
    image: $<NIP_PLUGIN_IMAGE>
    imagePullSecrets: $<NIP_IMAGE_PULL_SECRET>
    imagePullPolicy: $<IMAGE_PULL_POLICY>
    serviceAccountName: $<OBJ_NAME>
    command:
    - bash
    - -c
    - |-
      set -ex
      if echo "$POD_IP" | grep -qE '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
          LISTEN_ADDRESS_PORT_REPLACED_AT_RUNTIME="$<toString|PORT>"
      else
          LISTEN_ADDRESS_PORT_REPLACED_AT_RUNTIME="[::]:$<toString|PORT>"
      fi
      sed "s/LISTEN_ADDRESS_PORT_REPLACED_AT_RUNTIME/$LISTEN_ADDRESS_PORT_REPLACED_AT_RUNTIME/g" /etc/nginx/$<NGINX_CONF> >/tmp/$<NGINX_CONF>

      nginx -c /tmp/$<NGINX_CONF> -g 'daemon off;'
    env:
    - name: POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: LANG
      value: C.UTF-8
    - name: LC_ALL
      value: C.UTF-8
    - name: LANGUAGE
      value: C.UTF-8
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 25%
        maxSurge: 25%
    volumeMounts:
      - name: $<CERT_NAME>
        readOnly: true
        mountPath: /var/cert
      - name: $<NGINX_CONF_VOLUME>
        readOnly: true
        mountPath: /etc/nginx/$<NGINX_CONF>
        subPath: $<NGINX_CONF>
    volumes:
      - name: $<CERT_NAME>
        secret:
          secretName: $<CERT_NAME>
          defaultMode: 0420
      - name: $<NGINX_CONF_VOLUME>
        configMap:
          name: $<NGINX_CONF>
          defaultMode: 0420
          items:
          - key: $<NGINX_CONF>
            path: $<NGINX_CONF>

  - apiVersion: console.openshift.io/v1
    objName: $<PLUGIN_NAME>
    kind: ConsolePlugin
    template:
      spec:
        displayName: $<OBJ_NAME>
        i18n:
          loadType: Lazy
        backend:
          type: Service
          service:
            name: $<OBJ_NAME>
            namespace: $<HELM_RELEASE_NAMESPACE>
            port: $<PORT>
            basePath: /

  - templateName: configMap
    objName: $<NGINX_CONF>
    data:
      $<NGINX_CONF>: |-
        error_log /dev/stdout info;
        events {}
        http {
          access_log         /dev/stdout;
          include            /etc/nginx/mime.types;
          default_type       application/octet-stream;
          keepalive_timeout  65;
          server {
            listen              LISTEN_ADDRESS_PORT_REPLACED_AT_RUNTIME ssl;
            ssl_certificate     /var/cert/tls.crt;
            ssl_certificate_key /var/cert/tls.key;
            root                /usr/share/nginx/html;
          }
        }


